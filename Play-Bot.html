<!DOCTYPE html>
<html lang="en"> 
  <link href="Style.css" rel="stylesheet">
<head>
  <h1 id="Title2">Play Bot</h1>
  <head>
    <meta charset="UTF-8">
    <title>Chess Bot</title>
</head>

</head>
<body>
<div style="text-align: center; max-width: 400px; margin: 0 auto; color: #fff; font-family: sans-serif; background-color: #1e1e24; padding: 15px; border-radius: 8px; position: relative; box-sizing: border-box;">
    <div id="msg" style="font-weight: bold; margin-bottom: 10px; font-size: 16px; font-family: sans-serif;">Your Turn (White)</div>
    <div style="margin-bottom: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <div>
            <label for="diff" style="font-size: 13px; font-weight: bold; margin-right: 4px;">Difficulty:</label>
            <select id="diff" style="padding: 4px 6px; border-radius: 4px; border: 1px solid #3c4043; background: #2b2b36; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px;">
                <option value="800">Easy (800)</option>
                <option value="1200">Medium (1200)</option>
                <option value="1600" selected>Hard (1600)</option>
                <option value="3200">Unbeatable (3200)</option>
            </select>
        </div>
        <div>
            <label for="pColor" style="font-size: 13px; font-weight: bold; margin-right: 4px;">Play As:</label>
            <select id="pColor" onchange="changeColor()" style="padding: 4px 6px; border-radius: 4px; border: 1px solid #3c4043; background: #2b2b36; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px;">
                <option value="W" selected>White</option>
                <option value="B">Black</option>
            </select>
        </div>
    </div>

    <div id="promoModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); border-radius: 8px; flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
        <div style="font-weight: bold; margin-bottom: 15px; font-size: 18px;">Promote Your Pawn:</div>
        <div style="display: flex; gap: 10px;">
            <button onclick="handlePromoSelection('Q')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♕</button>
            <button onclick="handlePromoSelection('R')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♖</button>
            <button onclick="handlePromoSelection('B')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♗</button>
            <button onclick="handlePromoSelection('N')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♘</button>
        </div>
    </div>

    <div style="display: flex; justify-content: center; align-items: stretch;">
        <table id="tbl" style="border-collapse: collapse; margin: 0; border: 3px solid #3c4043; width: 360px; height: 360px; table-layout: fixed;"></table>
    </div>

    <div id="pgnBox" style="margin-top: 8px; background: #2b2b36; border: 1px solid #3c4043; border-radius: 4px; padding: 6px 8px; height: 38px; overflow-y: auto; text-align: left; font-size: 12px; color: #dcdcdc; line-height: 1.4; font-family: monospace;">Moves will appear here...</div>

    <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button id="undoBtn" onclick="undo()" style="flex: 1; padding: 8px; font-weight: bold; font-family: sans-serif; cursor: pointer; background-color: #555555; color: white; border: none; border-radius: 4px;">Undo Move</button>
        <button onclick="rst()" style="flex: 1; padding: 8px; font-weight: bold; font-family: sans-serif; cursor: pointer; background-color: #007acc; color: white; border: none; border-radius: 4px;">Restart Game</button>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 6px;">
        <button id="copyPgnBtn" onclick="copyExport('pgn')" style="flex: 1; padding: 6px; font-size: 12px; font-weight: bold; font-family: sans-serif; cursor: pointer; background-color: #2b2b36; color: #7fffd4; border: 1px solid #3c4043; border-radius: 4px;">Copy PGN (Analysis)</button>
        <button id="copyFenBtn" onclick="copyExport('fen')" style="flex: 1; padding: 6px; font-size: 12px; font-weight: bold; font-family: sans-serif; cursor: pointer; background-color: #2b2b36; color: #7fffd4; border: 1px solid #3c4043; border-radius: 4px;">Copy FEN</button>
    </div>
</div>

<script>
    var start = [
        ["r","n","b","q","k","b","n","r"],
        ["p","p","p","p","p","p","p","p"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["P","P","P","P","P","P","P","P"],
        ["R","N","B","Q","K","B","N","R"]
    ];

    var bd = JSON.parse(JSON.stringify(start)), sel = null, moves = [], turn = 'W';
    var syms = {'R':'♜','N':'♞','B':'♝','Q':'♛','K':'♚','P':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','p':'♟','':''};
    var vals = {'p':100,'n':310,'b':330,'r':500,'q':920,'k':100000,'P':100,'N':310,'B':330,'R':500,'Q':920,'K':100000};
    var isWhiteMap = {'P':1,'N':1,'B':1,'R':1,'Q':1,'K':1};
    var isBlackMap = {'p':1,'n':1,'b':1,'r':1,'q':1,'k':1};
    var boardHistory = [];
    var moveHistory = [];
    var lastMove = null;
    var halfMoves = 0;
    var gameResult = '*';

    var N_DR = [-2,-2,-1,-1,1,1,2,2];
    var N_DC = [-1,1,-2,2,-2,2,-1,1];
    var B_DR = [-1,-1,1,1];
    var B_DC = [-1,1,-1,1];
    var R_DR = [-1,1,0,0];
    var R_DC = [0,0,-1,1];
    var K_DR = [-1,-1,-1,0,0,1,1,1];
    var K_DC = [-1,0,1,-1,1,-1,0,1];

    var pPST = [
          0,  0,  0,  0,  0,  0,  0,  0,
          5, 10, 10,-25,-25, 10, 10,  5,
          5, -5,-10,  0,  0,-10, -5,  5,
          0,  0,  0, 28, 28,  0,  0,  0,
          5,  5, 12, 32, 32, 12,  5,  5,
         14, 14, 22, 32, 32, 22, 14, 14,
         55, 55, 55, 55, 55, 55, 55, 55,
          0,  0,  0,  0,  0,  0,  0,  0
    ];
    var nPST = [
        -50,-40,-30,-30,-30,-30,-40,-50,
        -40,-20,  0,  5,  5,  0,-20,-40,
        -30,  5, 18, 22, 22, 18,  5,-30,
        -30,  5, 22, 30, 30, 22,  5,-30,
        -30,  5, 22, 30, 30, 22,  5,-30,
        -30,  5, 18, 22, 22, 18,  5,-30,
        -40,-20,  0,  5,  5,  0,-20,-40,
        -50,-40,-30,-30,-30,-30,-40,-50
    ];
    var bPST = [
        -20,-10,-15,-10,-10,-15,-10,-20,
        -10,  8,  0,  5,  5,  0,  8,-10,
        -10, 10, 12, 15, 15, 12, 10,-10,
        -10,  5, 15, 18, 18, 15,  5,-10,
        -10,  8, 12, 18, 18, 12,  8,-10,
        -10,  5, 10, 12, 12, 10,  5,-10,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -20,-10,-15,-10,-10,-15,-10,-20
    ];
    var rPST = [
          0,  0,  5, 10, 10,  5,  0,  0,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
         -5,  0,  0,  0,  0,  0,  0, -5,
          8, 14, 14, 14, 14, 14, 14,  8,
          0,  0,  0,  0,  0,  0,  0,  0
    ];
    var qPST = [
        -20,-10,-10, -5, -5,-10,-10,-20,
        -10,  0,  5,  0,  0,  0,  0,-10,
        -10,  5,  5,  5,  5,  5,  0,-10,
         -5,  0,  5,  5,  5,  5,  0, -5,
          0,  0,  5,  5,  5,  5,  0, -5,
        -10,  0,  5,  5,  5,  5,  0,-10,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -20,-10,-10, -5, -5,-10,-10,-20
    ];
    var kMidPST = [
         20, 35, 15,-15, -5,-15, 35, 20,
         15, 15,-10,-20,-20,-10, 15, 15,
        -20,-30,-30,-40,-40,-30,-30,-20,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30
    ];
    var kEndPST = [
        -50,-30,-20,-20,-20,-20,-30,-50,
        -30,-10,  0,  0,  0,  0,-10,-30,
        -20,  0, 15, 20, 20, 15,  0,-20,
        -20,  0, 20, 28, 28, 20,  0,-20,
        -20,  0, 20, 28, 28, 20,  0,-20,
        -20,  0, 15, 20, 20, 15,  0,-20,
        -30,-10,  0,  0,  0,  0,-10,-30,
        -50,-30,-20,-20,-20,-20,-30,-50
    ];

    var epSquare = null;
    var hasMoved = {
        'W_K': false, 'W_R1': false, 'W_R8': false,
        'B_K': false, 'B_R1': false, 'B_R8': false
    };

    function saveState() {
        boardHistory.push(JSON.stringify({
            bd: bd,
            hasMoved: hasMoved,
            epSquare: epSquare,
            moveHistory: moveHistory,
            lastMove: lastMove,
            halfMoves: halfMoves
        }));
    }
    saveState();

    function getColor(p) {
        if (!p) return null;
        return isWhiteMap[p] ? 'W' : 'B';
    }

      function evalBoard(b) {
        var score = 0;
        var phase = 0;
        var bKIdx = 4, wKIdx = 60;
        var wBishops = 0, bBishops = 0;
        var wPawnCols = new Array(8).fill(0);
        var bPawnCols = new Array(8).fill(0);
        var wMinPawnRow = new Array(8).fill(8);
        var bMaxPawnRow = new Array(8).fill(-1);
        var wRookCols = [], bRookCols = [];
        var z = 0, o = 1, tw = 2, th = 3, fv = 5, sx = 6, sv = 7;

        for (var r = 0; r < 8; r++) {
            var row = b[r];
            for (var c = 0; c < 8; c++) {
                var p = row[c];
                if (p === '') continue;
                var idx = r * 8 + c;
                var flipIdx = (7 - r) * 8 + c;

                if (p === 'p') {
                    score += 100 + pPST[idx];
                    bPawnCols[c]++;
                    if (r > bMaxPawnRow[c]) bMaxPawnRow[c] = r;
                } else if (p === 'P') {
                    score -= 100 + pPST[flipIdx];
                    wPawnCols[c]++;
                    if (r < wMinPawnRow[c]) wMinPawnRow[c] = r;
                } else if (p === 'n') {
                    score += 310 + nPST[idx]; phase += 1;
                } else if (p === 'N') {
                    score -= 310 + nPST[flipIdx]; phase += 1;
                } else if (p === 'b') {
                    score += 330 + bPST[idx]; phase += 1; bBishops++;
                } else if (p === 'B') {
                    score -= 330 + bPST[flipIdx]; phase += 1; wBishops++;
                } else if (p === 'r') {
                    score += 500 + rPST[idx]; phase += 2; bRookCols.push(c);
                } else if (p === 'R') {
                    score -= 500 + rPST[flipIdx]; phase += 2; wRookCols.push(c);
                } else if (p === 'q') {
                    score += 920 + qPST[idx]; phase += 4;
                } else if (p === 'Q') {
                    score -= 920 + qPST[flipIdx]; phase += 4;
                } else if (p === 'k') {
                    bKIdx = idx;
                } else if (p === 'K') {
                    wKIdx = flipIdx;
                }
            }
        }

        if (bBishops >= 2) score += 42;
        if (wBishops >= 2) score -= 42;

        for (var i = 0; i < bRookCols.length; i++) {
            var rc = bRookCols[i];
            if (bPawnCols[rc] === 0) score += (wPawnCols[rc] === 0) ? 22 : 11;
        }
        for (var i = 0; i < wRookCols.length; i++) {
            var rc = wRookCols[i];
            if (wPawnCols[rc] === 0) score -= (bPawnCols[rc] === 0) ? 22 : 11;
        }

        for (var c = 0; c < 8; c++) {
            if (bPawnCols[c] > 1) score -= (bPawnCols[c] - 1) * 15;
            if (wPawnCols[c] > 1) score += (wPawnCols[c] - 1) * 15;

            if (bPawnCols[c] > 0) {
                var bIso = (c === 0 || bPawnCols[c - 1] === 0) && (c === 7 || bPawnCols[c + 1] === 0);
                if (bIso) score -= 14;
                var bBlocked = (wMinPawnRow[c] > bMaxPawnRow[c]) ||
                               (c > 0 && wMinPawnRow[c - 1] > bMaxPawnRow[c]) ||
                               (c < 7 && wMinPawnRow[c + 1] > bMaxPawnRow[c]);
                if (!bBlocked) score += (bMaxPawnRow[c] * bMaxPawnRow[c]) * 2.5;
            }
            if (wPawnCols[c] > 0) {
                var wIso = (c === 0 || wPawnCols[c - 1] === 0) && (c === 7 || wPawnCols[c + 1] === 0);
                if (wIso) score += 14;
                var wBlocked = (bMaxPawnRow[c] < wMinPawnRow[c]) ||
                               (c > 0 && bMaxPawnRow[c - 1] < wMinPawnRow[c]) ||
                               (c < 7 && bMaxPawnRow[c + 1] < wMinPawnRow[c]);
                if (!wBlocked) {
                    var adv = 7 - wMinPawnRow[c];
                    score -= (adv * adv) * 2.5;
                }
            }
        }

        var clampedPhase = phase > 24 ? 24 : phase;
        var bKingScore = ((kMidPST[bKIdx] * clampedPhase) + (kEndPST[bKIdx] * (24 - clampedPhase))) / 24;
        var wKingScore = ((kMidPST[wKIdx] * clampedPhase) + (kEndPST[wKIdx] * (24 - clampedPhase))) / 24;
        score += bKingScore - wKingScore;

        if (phase > 14) {
            var bRow0 = b[z], wRow7 = b[sv];
            if (bRow0[th] !== 'q' && (bRow0[o] === 'n' || bRow0[tw] === 'b' || bRow0[fv] === 'b' || bRow0[sx] === 'n')) score -= 30;
            if (wRow7[th] !== 'Q' && (wRow7[o] === 'N' || wRow7[tw] === 'B' || wRow7[fv] === 'B' || wRow7[sx] === 'N')) score += 30;

            if (bRow0[o] === 'n') score -= 8;
            if (bRow0[sx] === 'n') score -= 8;
            if (bRow0[tw] === 'b') score -= 8;
            if (bRow0[fv] === 'b') score -= 8;

            if (wRow7[o] === 'N') score += 8;
            if (wRow7[sx] === 'N') score += 8;
            if (wRow7[tw] === 'B') score += 8;
            if (wRow7[fv] === 'B') score += 8;
        }

        return score;
    }

      function buildSANPrefix(fr, fc, tr, tc, moveObj) {
        var piece = bd[fr][fc];
        var upper = piece.toUpperCase();
        var fileChars = 'abcdefgh';
        var toSq = fileChars[tc] + (8 - tr);

        if (upper === 'K' && Math.abs(tc - fc) === 2) {
            return tc === 6 ? 'O-O' : 'O-O-O';
        }

        var isCapture = (bd[tr][tc] !== '' || (moveObj && moveObj.isENPassant));
        if (upper === 'P') {
            return (isCapture ? fileChars[fc] + 'x' : '') + toSq;
        }

        var sameFile = false, sameRank = false, ambig = false;
        for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
                if ((r !== fr || c !== fc) && bd[r][c] === piece) {
                    var leg = getLegal(r, c, bd, false, null);
                    for (var i = 0; i < leg.length; i++) {
                        if (leg[i].r === tr && leg[i].c === tc) {
                            ambig = true;
                            if (c === fc) sameFile = true;
                            if (r === fr) sameRank = true;
                        }
                    }
                }
            }
        }

        var disambig = '';
        if (ambig) {
            if (!sameFile) disambig = fileChars[fc];
            else if (!sameRank) disambig = '' + (8 - fr);
            else disambig = fileChars[fc] + (8 - fr);
        }

        return upper + disambig + (isCapture ? 'x' : '') + toSq;
    }

    function finalizeSAN(sanBase, nextColor) {
        var inCheck = check(nextColor, bd, null);
        if (inCheck) {
            var hasMoves = false;
            for (var r = 0; r < 8; r++) {
                for (var c = 0; c < 8; c++) {
                    if (bd[r][c] && getColor(bd[r][c]) === nextColor && getLegal(r, c, bd, false, null).length > 0) {
                        hasMoves = true; break;
                    }
                }
                if (hasMoves) break;
            }
            sanBase += hasMoves ? '+' : '#';
        }
        moveHistory.push(sanBase);
        renderMoveList();
    }

    function renderMoveList() {
        var box = document.getElementById('pgnBox');
        if (!box) return;
        if (moveHistory.length === 0) {
            box.innerText = 'Moves will appear here...';
            return;
        }
        var out = [];
        for (var i = 0; i < moveHistory.length; i += 2) {
            var num = (i / 2 + 1) + '. ';
            var wMove = moveHistory[i];
            var bMove = moveHistory[i + 1] ? ' ' + moveHistory[i + 1] : '';
            out.push(num + wMove + bMove);
        }
        box.innerText = out.join('  ');
        box.scrollTop = box.scrollHeight;
    }

    function getFEN() {
        var rows = [];
        for (var r = 0; r < 8; r++) {
            var rowStr = '', empty = 0;
            for (var c = 0; c < 8; c++) {
                if (bd[r][c] === '') {
                    empty++;
                } else {
                    if (empty > 0) { rowStr += empty; empty = 0; }
                    rowStr += bd[r][c];
                }
            }
            if (empty > 0) rowStr += empty;
            rows.push(rowStr);
        }
        var active = (turn === 'B') ? 'b' : 'w';
        var castling = '';
        if (!hasMoved['W_K'] && !hasMoved['W_R8']) castling += 'K';
        if (!hasMoved['W_K'] && !hasMoved['W_R1']) castling += 'Q';
        if (!hasMoved['B_K'] && !hasMoved['B_R8']) castling += 'k';
        if (!hasMoved['B_K'] && !hasMoved['B_R1']) castling += 'q';
        if (castling === '') castling = '-';

        var ep = epSquare ? ('abcdefgh'[epSquare.c] + (8 - epSquare.r)) : '-';
        var fullMove = Math.floor(moveHistory.length / 2) + 1;
        return rows.join('/') + ' ' + active + ' ' + castling + ' ' + ep + ' ' + halfMoves + ' ' + fullMove;
    }

    function getPGN() {
        var pColor = document.getElementById('pColor').value;
        var diffLabel = document.getElementById('diff').options[document.getElementById('diff').selectedIndex].text;
        var whiteName = pColor === 'W' ? 'Club Player' : 'Club Bot (' + diffLabel + ')';
        var blackName = pColor === 'B' ? 'Club Player' : 'Club Bot (' + diffLabel + ')';
        var headers = [
            '[Event "Chess Club Practice"]',
            '[White "' + whiteName + '"]',
            '[Black "' + blackName + '"]',
            '[Result "' + gameResult + '"]'
        ];
        var movesTxt = [];
        for (var i = 0; i < moveHistory.length; i += 2) {
            var line = (i / 2 + 1) + '. ' + moveHistory[i];
            if (moveHistory[i + 1]) line += ' ' + moveHistory[i + 1];
            movesTxt.push(line);
        }
        return headers.join('\n') + '\n\n' + movesTxt.join(' ') + (movesTxt.length ? ' ' : '') + gameResult;
    }

    function copyExport(type) {
        var text = (type === 'fen') ? getFEN() : getPGN();
        var btn = document.getElementById(type === 'fen' ? 'copyFenBtn' : 'copyPgnBtn');
        var origText = btn.innerText;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                btn.innerText = 'Copied!';
                setTimeout(function() { btn.innerText = origText; }, 1400);
            });
        } else {
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            btn.innerText = 'Copied!';
            setTimeout(function() { btn.innerText = origText; }, 1400);
        }
    }

    function isInsufficientMaterial() {
        var wMinors = [], bMinors = [];
        for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
                var p = bd[r][c];
                if (!p || p === 'K' || p === 'k') continue;
                if (p === 'P' || p === 'p' || p === 'R' || p === 'r' || p === 'Q' || p === 'q') return false;
                var sqColor = (r + c) % 2;
                if (p === 'B' || p === 'N') wMinors.push({ type: p, color: sqColor });
                if (p === 'b' || p === 'n') bMinors.push({ type: p, color: sqColor });
            }
        }
        if (wMinors.length === 0 && bMinors.length === 0) return true;
        if (wMinors.length + bMinors.length === 1) return true;
        if (wMinors.length === 1 && bMinors.length === 1 && wMinors[0].type === 'B' && bMinors[0].type === 'b') {
            return wMinors[0].color === bMinors[0].color;
        }
        return false;
    }

    function isSquareAttacked(kr, kc, byColor, b) {
        var isByWhite = (byColor === 'W');
        var pAtt = isByWhite ? 'P' : 'p';
        var nAtt = isByWhite ? 'N' : 'n';
        var bAtt = isByWhite ? 'B' : 'b';
        var rAtt = isByWhite ? 'R' : 'r';
        var qAtt = isByWhite ? 'Q' : 'q';
        var kAtt = isByWhite ? 'K' : 'k';
        var zero = 0, one = 1, four = 4, seven = 7, eight = 8;

        var pRow = isByWhite ? kr + one : kr - one;
        if (pRow >= zero && pRow < eight) {
            if (kc > zero && b[pRow][kc - one] === pAtt) return true;
            if (kc < seven && b[pRow][kc + one] === pAtt) return true;
        }

        for (var i = 0; i < eight; i++) {
            var nr = kr + N_DR[i], nc = kc + N_DC[i];
            if (nr >= zero && nr < eight && nc >= zero && nc < eight && b[nr][nc] === nAtt) return true;
        }

            return isMax ? alpha : beta;
        }

                               function minimax(b, depth, alpha, beta, isMax, ply, allowNull) {
            if ((++nodes & 511) === 0 && Date.now() - startTime > timeLimitMs) {
                timeUp = true;
                return 0;
            }

            var key = computeHash(b, isMax);

            // Check repetition only on real moves (allowNull === true means not immediately after a null move)
            if (ply > 0 && allowNull) {
                if (gameRepHistory[key] >= 1) return 0;
                for (var sp = 0; sp < ply; sp++) {
                    if (searchPathKeys[sp] === key) return 0;
                }
            }
            searchPathKeys[ply] = key;

            var activeColor = isMax ? 'B' : 'W';
            var enemyColor = isMax ? 'W' : 'B';
            var myKing = isMax ? bKing : wKing;
            var inCheck = isSquareAttacked(myKing.r, myKing.c, enemyColor, b);

            if (is3200 && inCheck && ply < 22) {
                depth += 1;
            }

            var alphaOrig = alpha;
            var betaOrig = beta;
            var ttEntry = ttTable[key];
            var ttBest = null;

            if (ttEntry) {
                ttBest = ttEntry.best;
                if (ttEntry.depth >= depth) {
                    if (ttEntry.flag === 0) return ttEntry.score;
                    if (ttEntry.flag === 1 && ttEntry.score > alpha) alpha = ttEntry.score;
                    else if (ttEntry.flag === 2 && ttEntry.score < beta) beta = ttEntry.score;
                    if (alpha >= beta) return ttEntry.score;
                }
            }

            if (depth <= 0) return quiesce(b, alpha, beta, isMax, maxQDepth);

            // Null-Move Pruning (safely disables repetition check for 1 ply so null-move doesn't return false 0)
            if (is3200 && allowNull && !inCheck && depth >= 3 && ply > 0) {
                var R = depth > 6 ? 3 : 2;
                var nullScore = minimax(b, depth - 1 - R, alpha, beta, !isMax, ply + 1, false);
                if (timeUp) return 0;
                if (isMax && nullScore >= beta) return beta;
                if (!isMax && nullScore <= alpha) return alpha;
            }

            var movesList = getFastMoves(activeColor, b, true, false, ply, ttBest);
            var legalCount = 0;
            var bestMoveObj = null;

            if (isMax) {
                var maxVal = -Infinity;
                for (var i = 0; i < movesList.length; i++) {
                    var m = movesList[i];
                    var isQuiet = (b[m.to.r][m.to.c] === '' && !m.to.isENPassant);
                    var uData = makeSimMove(b, m);
                    if (isSquareAttacked(myKing.r, myKing.c, enemyColor, b)) {
                        unmakeSimMove(b, m, uData);
                        continue;
                    }
                    legalCount++;

                    var score;
                    if (legalCount === 1) {
                        score = minimax(b, depth - 1, alpha, beta, false, ply + 1, true);
                    } else {
                        var reduce = (is3200 && depth >= 3 && legalCount > 4 && isQuiet && !inCheck) ? 1 : 0;
                        score = minimax(b, depth - 1 - reduce, alpha, alpha + 1, false, ply + 1, true);
                        if (!timeUp && score > alpha && (reduce > 0 || score < beta)) {
                            score = minimax(b, depth - 1, alpha, beta, false, ply + 1, true);
                        }
                    }

                    unmakeSimMove(b, m, uData);
                    if (timeUp) return 0;
                    if (score > maxVal) {
                        maxVal = score;
                        bestMoveObj = { fr: m.fr, fc: m.fc, tr: m.to.r, tc: m.to.c };
                    }
                    if (score > alpha) alpha = score;
                    if (beta <= alpha) {
                        if (isQuiet && ply < 28) {
                            killers[ply].unshift({ fr: m.fr, fc: m.fc, tr: m.to.r, tc: m.to.c });
                            killers[ply].pop();
                        }
                        break;
                    }
                }
                if (legalCount === 0) {
                    return inCheck ? -999999 - depth : 0;
                }
                if (ttSize < 150000) {
                    var flag = maxVal <= alphaOrig ? 2 : (maxVal >= betaOrig ? 1 : 0);
                    if (!ttEntry) ttSize++;
                    ttTable[key] = { depth: depth, score: maxVal, flag: flag, best: bestMoveObj };
                }
                return maxVal;
            } else {
                var minVal = Infinity;
                for (var i = 0; i < movesList.length; i++) {
                    var m = movesList[i];
                    var isQuiet = (b[m.to.r][m.to.c] === '' && !m.to.isENPassant);
                    var uData = makeSimMove(b, m);
                    if (isSquareAttacked(myKing.r, myKing.c, enemyColor, b)) {
                        unmakeSimMove(b, m, uData);
                        continue;
                    }
                    legalCount++;

                    var score;
                    if (legalCount === 1) {
                        score = minimax(b, depth - 1, alpha, beta, true, ply + 1, true);
                    } else {
                        var reduce = (is3200 && depth >= 3 && legalCount > 4 && isQuiet && !inCheck) ? 1 : 0;
                        score = minimax(b, depth - 1 - reduce, beta - 1, beta, true, ply + 1, true);
                        if (!timeUp && score < beta && (reduce > 0 || score > alpha)) {
                            score = minimax(b, depth - 1, alpha, beta, true, ply + 1, true);
                        }
                    }

                    unmakeSimMove(b, m, uData);
                    if (timeUp) return 0;
                    if (score < minVal) {
                        minVal = score;
                        bestMoveObj = { fr: m.fr, fc: m.fc, tr: m.to.r, tc: m.to.c };
                    }
                    if (score < beta) beta = score;
                    if (beta <= alpha) {
                        if (isQuiet && ply < 28) {
                            killers[ply].unshift({ fr: m.fr, fc: m.fc, tr: m.to.r, tc: m.to.c });
                            killers[ply].pop();
                        }
                        break;
                    }
                }
                if (legalCount === 0) {
                    return inCheck ? 999999 + depth : 0;
                }
                if (ttSize < 150000) {
                    var flag = minVal <= alphaOrig ? 2 : (minVal >= betaOrig ? 1 : 0);
                    if (!ttEntry) ttSize++;
                    ttTable[key] = { depth: depth, score: minVal, flag: flag, best: bestMoveObj };
                }
                return minVal;
            }
        }

        var topMoves = [];
        var rootColorMap = botColor === 'W' ? isWhiteMap : isBlackMap;
        var rootKing = botColor === 'W' ? wKing : bKing;
        for (var r = 0; r < eight; r++) {
            for (var c = 0; c < eight; c++) {
                var piece = simBoard[r][c];
                if (piece !== '' && rootColorMap[piece]) {
                    var leg = getLegal(r, c, simBoard, false, rootKing);
                    for (var i = 0; i < leg.length; i++) {
                        var to = leg[i];
                        var target = simBoard[to.r][to.c];
                        var mvvScore = target !== '' ? (vals[target] * 10 - vals[piece]) : 0;
                        topMoves.push({ fr: r, fc: c, to: to, order: mvvScore });
                    }
                }
            }
        }
        topMoves.sort(function(a, b) { return b.order - a.order; });
        if (topMoves.length === 0) return;

        var bm = null;
        var isEarlyOpening = moveHistory.length < 6;
        var bookMoves = [];
        if (moveHistory.length === 0) {
            bookMoves = [
                { fr: 6, fc: 4, tr: 4, tc: 4 },
                { fr: 6, fc: 3, tr: 4, tc: 3 },
                { fr: 6, fc: 2, tr: 4, tc: 2 },
                { fr: 7, fc: 6, tr: 5, tc: 5 }
            ];
        } else if (moveHistory.length === 1) {
            var r4 = 4, c4 = 4;
            if (bd[r4][c4] === 'P') {
                bookMoves = [
                    { fr: 1, fc: 4, tr: 3, tc: 4 },
                    { fr: 1, fc: 2, tr: 3, tc: 2 },
                    { fr: 1, fc: 4, tr: 2, tc: 4 },
                    { fr: 1, fc: 2, tr: 2, tc: 2 }
                ];
            } else {
                bookMoves = [
                    { fr: 1, fc: 3, tr: 3, tc: 3 },
                    { fr: 0, fc: 6, tr: 2, tc: 5 },
                    { fr: 1, fc: 4, tr: 2, tc: 4 }
                ];
            }
        }

        var chosenBook = bookMoves.length > 0 ? bookMoves[Math.floor(Math.random() * bookMoves.length)] : null;
        var bestEvaluatedMoves = [];
        searchPathKeys = [computeHash(simBoard, botColor === 'B')];

        for (var d = 1; d <= maxDepth; d++) {
            var currentDepthMoves = [];
            for (var i = 0; i < topMoves.length; i++) {
                var m = topMoves[i];
                var uData = makeSimMove(simBoard, m);
                var baseValue = minimax(simBoard, d - 1, -Infinity, Infinity, botColor === 'W', 1, true);
                unmakeSimMove(simBoard, m, uData);
                if (timeUp) break;

                var bookBonus = 0;
                if (chosenBook && m.fr === chosenBook.fr && m.fc === chosenBook.fc && m.to.r === chosenBook.tr && m.to.c === chosenBook.tc) {
                    bookBonus = botColor === 'B' ? 28 : -28;
                }
                var jitterRange = is3200 ? 0 : (isEarlyOpening ? 14 : 0);
                var varietyJitter = jitterRange > 0 ? (Math.random() * jitterRange - jitterRange / 2) : 0;
currentDepthMoves.push({ move: m, score: baseValue + bookBonus + varietyJitter });
}
if (timeUp) break;
currentDepthMoves.sort(function(a, b) {
return botColor === 'B' ? b.score - a.score : a.score - b.score;
});
bestEvaluatedMoves = currentDepthMoves;
topMoves = bestEvaluatedMoves.map(function(item) { return item.move; });
}
if (bestEvaluatedMoves.length === 0) {
bestEvaluatedMoves = [{ move: topMoves[zero], score: evalEnhanced(simBoard) }];
}
var roll = Math.random() * 100;
var targetIndex = 0;
if (isHard) {
targetIndex = 0;
} else if (diffSetting === "1200") {
if (roll > 92 && bestEvaluatedMoves.length > 1) targetIndex = 1;
} else if (diffSetting === "800") {
if (roll > 82 && bestEvaluatedMoves.length > 1) {
targetIndex = Math.min(Math.floor(Math.random() * two) + 1, bestEvaluatedMoves.length - 1);
}
}
bm = bestEvaluatedMoves[targetIndex].move;
var botMovingPiece = bd[bm.fr][bm.fc];
var botIsCapture = (bd[bm.to.r][bm.to.c] !== '' || bm.to.isENPassant);
var botSanBase = buildSANPrefix(bm.fr, bm.fc, bm.to.r, bm.to.c, bm.to);
var isBotPromo = (botMovingPiece === 'p' && bm.to.r === seven) || (botMovingPiece === 'P' && bm.to.r === zero);
if (isBotPromo) botSanBase += '=Q';
if (bd[bm.fr][bm.fc] === 'K') hasMoved['W_K'] = true;
if (bd[bm.fr][bm.fc] === 'R' && bm.fr === seven && bm.fc === zero) hasMoved['W_R1'] = true;
if (bd[bm.fr][bm.fc] === 'R' && bm.fr === seven && bm.fc === seven) hasMoved['W_R8'] = true;
if (bd[bm.fr][bm.fc] === 'k') hasMoved['B_K'] = true;
if (bd[bm.fr][bm.fc] === 'r' && bm.fr === zero && bm.fc === zero) hasMoved['B_R1'] = true;
if (bd[bm.fr][bm.fc] === 'r' && bm.fr === zero && bm.fc === seven) hasMoved['B_R8'] = true;
if (bm.to.isENPassant) bd[bm.fr][bm.to.c] = '';
var botFromCol = bm.fc;
var botFromRow = bm.fr;
bd[bm.to.r][bm.to.c] = bd[bm.fr][bm.fc];
bd[bm.fr][bm.fc] = '';
lastMove = { fr: botFromRow, fc: botFromCol, tr: bm.to.r, tc: bm.to.c };
halfMoves = (botMovingPiece === 'p' || botMovingPiece === 'P' || botIsCapture) ? 0 : halfMoves + 1;
if (bd[bm.to.r][bm.to.c] === 'p' && bm.to.r === seven) bd[bm.to.r][bm.to.c] = 'q';
if (bd[bm.to.r][bm.to.c] === 'P' && bm.to.r === zero) bd[bm.to.r][bm.to.c] = 'Q';
if ((bd[bm.to.r][bm.to.c] === 'K' || bd[bm.to.r][bm.to.c] === 'k') && Math.abs(bm.to.c - botFromCol) === two) {
if (bm.to.c === six) {
bd[bm.to.r].splice(five, 1, bd[bm.to.r][seven]);
bd[bm.to.r].splice(seven, 1, '');
}
if (bm.to.c === two) {
bd[bm.to.r].splice(three, 1, bd[bm.to.r][zero]);
bd[bm.to.r].splice(zero, 1, '');
}
}
epSquare = ((bd[bm.to.r][bm.to.c] === 'p' || bd[bm.to.r][bm.to.c] === 'P') && Math.abs(bm.to.r - botFromRow) === two) ? { r: (botFromRow + bm.to.r) / two, c: bm.to.c } : null;
var playerColor = document.getElementById('pColor').value;
finalizeSAN(botSanBase, playerColor);
saveState();
turn = playerColor;
endState(playerColor);
draw();
}
  
  
function handlePromoSelection(pieceType) {
if (!window.pendingPromo) return;
var r = window.pendingPromo.row;
var c = window.pendingPromo.col;
var cl = window.pendingPromo.color;
var sanBase = window.pendingPromo.sanPrefix + '=' + pieceType.toUpperCase();
bd[r][c] = cl === 'W' ? pieceType.toUpperCase() : pieceType.toLowerCase();
document.getElementById('promoModal').style.display = 'none';
window.pendingPromo = null;
epSquare = null;
var nextColor = cl === 'W' ? 'B' : 'W';
finalizeSAN(sanBase, nextColor);
saveState();
if (endState(nextColor)) { draw(); return; }
turn = nextColor;
document.getElementById('msg').innerText = "Bot thinking...";
draw();
setTimeout(bot, 40);
}
function changeColor() {
var choice = document.getElementById('pColor').value;
draw();
if (choice === 'B') {
turn = 'W';
document.getElementById('pColor').disabled = true;
document.getElementById('diff').disabled = true;
document.getElementById('msg').innerText = "Bot thinking...";
setTimeout(bot, 150);
} else {
turn = 'W';
document.getElementById('msg').innerText = "Your Turn (White)";
}
}
function endState(cl) {
var currentStr = JSON.stringify(bd);
var repeatCount = 0;
for (var i = 0; i < boardHistory.length; i++) {
var entry = JSON.parse(boardHistory[i]);
var hBoard = Array.isArray(entry) ? entry : entry.bd;
if (JSON.stringify(hBoard) === currentStr) repeatCount++;
}
if (repeatCount >= 3) {
document.getElementById('msg').innerText = "Draw by Threefold Repetition!";
gameResult = '1/2-1/2';
turn = 'E';
return true;
}
if (halfMoves >= 100) {
document.getElementById('msg').innerText = "Draw by 50-Move Rule!";
gameResult = '1/2-1/2';
turn = 'E';
return true;
}
if (isInsufficientMaterial()) {
document.getElementById('msg').innerText = "Draw by Insufficient Material!";
gameResult = '1/2-1/2';
turn = 'E';
return true;
}
var any = false;
for (var r = 0; r < 8; r++) {
for (var c = 0; c < 8; c++) {
if (bd[r][c] && getColor(bd[r][c]) === cl && getLegal(r, c, bd, false, null).length > 0) {
any = true; break;
}
}
if (any) break;
}
var box = document.getElementById('msg');
var playerColor = document.getElementById('pColor').value;
var colorLabel = playerColor === 'W' ? 'White' : 'Black';
if (!any) {
if (check(cl, bd, null)) {
box.innerText = cl === playerColor ? "Checkmate! Bot wins." : "Checkmate! You win!";
gameResult = (cl === 'W') ? '0-1' : '1-0';
} else {
box.innerText = "Draw / Stalemate!";
gameResult = '1/2-1/2';
}
turn = 'E';
return true;
}
box.innerText = check(cl, bd, null) ? "Your Turn - CHECK!" : (cl === playerColor ? "Your Turn (" + colorLabel + ")" : "Bot calculating...");
return false;
}
function undo() {
var playerColor = document.getElementById('pColor').value;
var minHistory = playerColor === 'W' ? 3 : 4;
var zero = 0, one = 1, four = 4, seven = 7;
if (window.pendingPromo) {
window.pendingPromo = null;
document.getElementById('promoModal').style.display = 'none';
var curSnap = JSON.parse(boardHistory[boardHistory.length - one]);
bd = Array.isArray(curSnap) ? curSnap : curSnap.bd;
epSquare = curSnap.epSquare || null;
moveHistory = curSnap.moveHistory ? curSnap.moveHistory.slice() : [];
lastMove = curSnap.lastMove || null;
halfMoves = curSnap.halfMoves || 0;
gameResult = '*';
sel = null; moves = []; turn = playerColor;
renderMoveList(); endState(playerColor); draw();
return;
}
if (boardHistory.length < minHistory) return;
if (turn !== playerColor && turn !== 'E') return;
boardHistory.pop();
boardHistory.pop();
var prev = JSON.parse(boardHistory[boardHistory.length - one]);
bd = Array.isArray(prev) ? prev : prev.bd;
epSquare = prev.epSquare || null;
moveHistory = prev.moveHistory ? prev.moveHistory.slice() : [];
lastMove = prev.lastMove || null;
halfMoves = prev.halfMoves || 0;
gameResult = '*';
hasMoved = {
'W_K': false, 'W_R1': false, 'W_R8': false,
'B_K': false, 'B_R1': false, 'B_R8': false
};
for (var i = 0; i < boardHistory.length; i++) {
var entry = JSON.parse(boardHistory[i]);
var hBoard = Array.isArray(entry) ? entry : entry.bd;
if (hBoard[seven][four] !== 'K') hasMoved['W_K'] = true;
if (hBoard[seven][zero] !== 'R') hasMoved['W_R1'] = true;
if (hBoard[seven][seven] !== 'R') hasMoved['W_R8'] = true;
if (hBoard[zero][four] !== 'k') hasMoved['B_K'] = true;
if (hBoard[zero][zero] !== 'r') hasMoved['B_R1'] = true;
if (hBoard[zero][seven] !== 'r') hasMoved['B_R8'] = true;
}
sel = null; moves = []; turn = playerColor;
renderMoveList(); endState(playerColor); draw();
}
function rst() {
bd = JSON.parse(JSON.stringify(start));
sel = null; moves = []; turn = 'W';
boardHistory = [];
moveHistory = [];
lastMove = null;
halfMoves = 0;
gameResult = '*';
saveState();
epSquare = null;
hasMoved = { 'W_K': false, 'W_R1': false, 'W_R8': false, 'B_K': false, 'B_R1': false, 'B_R8': false };
document.getElementById('pColor').disabled = false;
document.getElementById('diff').disabled = false;
document.getElementById('pColor').value = 'W';
document.getElementById('msg').innerText = "Your Turn (White)";
renderMoveList();
draw();
}
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', draw);
} else {
draw();
}
