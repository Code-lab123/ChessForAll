<!DOCTYPE html>
<html lang="en">
  <link href="Style.css" rel="stylesheet">
<head>
  <h1 id="Title2">Play Bot</h1>
  <head>
    <meta charset="UTF-8">
    <title>Chess Bot</title>
</head>

</head>
<body>
<div style="text-align: center; max-width: 380px; margin: 0 auto; color: #fff; font-family: sans-serif; background-color: #1e1e24; padding: 15px; border-radius: 8px; position: relative;">
    <div id="msg" style="font-weight: bold; margin-bottom: 10px; font-size: 16px; font-family: sans-serif;">Your Turn (White)</div>
    <div style="margin-bottom: 12px; display: flex; justify-content: center; gap: 15px;">
        <div>
            <label for="diff" style="font-size: 14px; font-weight: bold; margin-right: 5px;">Difficulty:</label>
            <select id="diff" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #3c4043; background: #2b2b36; color: #fff; font-weight: bold; cursor: pointer;">
                <option value="800">Easy</option>
                <option value="1200">Medium</option>
                <option value="1600" selected>Hard</option>
            </select>
        </div>
        <div>
            <label for="pColor" style="font-size: 14px; font-weight: bold; margin-right: 5px;">Play As:</label>
            <select id="pColor" onchange="changeColor()" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #3c4043; background: #2b2b36; color: #fff; font-weight: bold; cursor: pointer;">
                <option value="W" selected>White</option>
                <option value="B">Black</option>
            </select>
        </div>
    </div>

    <div id="promoModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); border-radius: 8px; flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
        <div style="font-weight: bold; margin-bottom: 15px; font-size: 18px;">Promote Your Pawn:</div>
        <div style="display: flex; gap: 10px;">
            <button onclick="handlePromoSelection('Q')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♕</button>
            <button onclick="handlePromoSelection('R')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♖</button>
            <button onclick="handlePromoSelection('B')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♗</button>
            <button onclick="handlePromoSelection('N')" style="font-size: 24px; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; border: none; background: #3c4043; color: white;">♘</button>
        </div>
    </div>

    <table id="tbl" style="border-collapse: collapse; margin: 0 auto; border: 3px solid #3c4043; width: 360px; height: 360px; table-layout: fixed;"></table>

    <button onclick="undo()" style="margin-top: 10px; width: 100%; padding: 8px; font-weight: bold; font-family: sans-serif; cursor: pointer; background-color: #555555; color: white; border: none; border-radius: 4px; margin-bottom: 5px;">Undo Move</button>
    <button onclick="rst()" style="margin-top: 5px; width: 100%; padding: 8px; font-weight: bold; font-family: sans-serif; cursor: pointer; background-color: #007acc; color: white; border: none; border-radius: 4px;">Restart Game</button>
</div>
<script>
    var start = JSON.parse('[["r","n","b","q","k","b","n","r"],["p","p","p","p","p","p","p","p"],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["P","P","P","P","P","P","P","P"],["R","N","B","Q","K","B","N","R"]]');

    var bd = JSON.parse(JSON.stringify(start)), sel = null, moves = [], turn = 'W';
    var syms = {'R':'♜','N':'♞','B':'♝','Q':'♛','K':'♚','P':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','p':'♟','':''};
    var vals = {'p':100,'n':300,'b':310,'r':500,'q':900,'k':100000,'P':100,'N':300,'B':310,'R':500,'Q':900,'K':100000};
    var isWhiteMap = {'P':1,'N':1,'B':1,'R':1,'Q':1,'K':1};
    var isBlackMap = {'p':1,'n':1,'b':1,'r':1,'q':1,'k':1};
    var boardHistory = [];

    var N_DR = JSON.parse('[-2,-2,-1,-1,1,1,2,2]');
    var N_DC = JSON.parse('[-1,1,-2,2,-2,2,-1,1]');
    var B_DR = JSON.parse('[-1,-1,1,1]');
    var B_DC = JSON.parse('[-1,1,-1,1]');
    var R_DR = JSON.parse('[-1,1,0,0]');
    var R_DC = JSON.parse('[0,0,-1,1]');
    var K_DR = JSON.parse('[-1,-1,-1,0,0,1,1,1]');
    var K_DC = JSON.parse('[-1,0,1,-1,1,-1,0,1]');

    var epSquare = null;
    var hasMoved = {
        'W_K': false, 'W_R1': false, 'W_R8': false,
        'B_K': false, 'B_R1': false, 'B_R8': false
    };

    function saveState() {
        boardHistory.push(JSON.stringify({
            bd: bd,
            hasMoved: hasMoved,
            epSquare: epSquare
        }));
    }
    saveState();

    function getColor(p) {
        if (!p) return null;
        return isWhiteMap[p] ? 'W' : 'B';
    }

    function isSquareAttacked(kr, kc, byColor, b) {
        var isByWhite = (byColor === 'W');
        var pAtt = isByWhite ? 'P' : 'p';
        var nAtt = isByWhite ? 'N' : 'n';
        var bAtt = isByWhite ? 'B' : 'b';
        var rAtt = isByWhite ? 'R' : 'r';
        var qAtt = isByWhite ? 'Q' : 'q';
        var kAtt = isByWhite ? 'K' : 'k';
        var zero = 0, one = 1, four = 4, seven = 7, eight = 8;

        var pRow = isByWhite ? kr + one : kr - one;
        if (pRow >= zero && pRow < eight) {
            if (kc > zero && b[pRow][kc - one] === pAtt) return true;
            if (kc < seven && b[pRow][kc + one] === pAtt) return true;
        }

        for (var i = 0; i < eight; i++) {
            var nr = kr + N_DR[i], nc = kc + N_DC[i];
            if (nr >= zero && nr < eight && nc >= zero && nc < eight && b[nr][nc] === nAtt) return true;
        }

        for (var i = 0; i < eight; i++) {
            var nr = kr + K_DR[i], nc = kc + K_DC[i];
            if (nr >= zero && nr < eight && nc >= zero && nc < eight && b[nr][nc] === kAtt) return true;
        }

        for (var i = 0; i < four; i++) {
            var dr = R_DR[i], dc = R_DC[i];
            var nr = kr + dr, nc = kc + dc;
            while (nr >= zero && nr < eight && nc >= zero && nc < eight) {
                var sq = b[nr][nc];
                if (sq !== '') {
                    if (sq === rAtt || sq === qAtt) return true;
                    break;
                }
                nr += dr; nc += dc;
            }
        }

        for (var i = 0; i < four; i++) {
            var dr = B_DR[i], dc = B_DC[i];
            var nr = kr + dr, nc = kc + dc;
            while (nr >= zero && nr < eight && nc >= zero && nc < eight) {
                var sq = b[nr][nc];
                if (sq !== '') {
                    if (sq === bAtt || sq === qAtt) return true;
                    break;
                }
                nr += dr; nc += dc;
            }
        }
        return false;
    }

    function check(cl, b, kPos) {
        var targetK = cl === 'W' ? 'K' : 'k';
        var kr = -1, kc = -1;
        if (kPos) {
            kr = kPos.r; kc = kPos.c;
        } else {
            for (var r = 0; r < 8; r++) {
                for (var c = 0; c < 8; c++) {
                    if (b[r][c] === targetK) { kr = r; kc = c; break; }
                }
                if (kr !== -1) break;
            }
        }
        if (kr === -1) return false;
        return isSquareAttacked(kr, kc, cl === 'W' ? 'B' : 'W', b);
    }

    function getPseudo(r, c, b, checkCastlingSafe, inSim) {
        var p = b[r][c];
        var isW = !!isWhiteMap[p];
        var cl = isW ? 'W' : 'B';
        var enemyMap = isW ? isBlackMap : isWhiteMap;
        var m = [];
        var zero = 0, one = 1, two = 2, three = 3, four = 4, five = 5, six = 6, seven = 7, eight = 8;

        if (p === 'P' || p === 'p') {
            var d = isW ? -1 : 1, s = isW ? six : one;
            var r1 = r + d;
            if (r1 >= zero && r1 < eight) {
                if (b[r1][c] === '') {
                    m.push({ r: r1, c: c });
                    if (r === s && b[r + two * d][c] === '') m.push({ r: r + two * d, c: c, isDouble: true });
                }
                if (c > zero) {
                    if (enemyMap[b[r1][c - one]]) m.push({ r: r1, c: c - one });
                    else if (!inSim && epSquare && epSquare.r === r1 && epSquare.c === c - one) m.push({ r: r1, c: c - one, isENPassant: true });
                }
                if (c < seven) {
                    if (enemyMap[b[r1][c + one]]) m.push({ r: r1, c: c + one });
                    else if (!inSim && epSquare && epSquare.r === r1 && epSquare.c === c + one) m.push({ r: r1, c: c + one, isENPassant: true });
                }
            }
            return m;
        }

        if (p === 'N' || p === 'n') {
            for (var i = 0; i < eight; i++) {
                var nr = r + N_DR[i], nc = c + N_DC[i];
                if (nr >= zero && nr < eight && nc >= zero && nc < eight) {
                    var target = b[nr][nc];
                    if (target === '' || enemyMap[target]) m.push({ r: nr, c: nc });
                }
            }
            return m;
        }

        if (p === 'B' || p === 'b' || p === 'Q' || p === 'q') {
            for (var i = 0; i < four; i++) {
                var dr = B_DR[i], dc = B_DC[i];
                var nr = r + dr, nc = c + dc;
                while (nr >= zero && nr < eight && nc >= zero && nc < eight) {
                    var target = b[nr][nc];
                    if (target === '') {
                        m.push({ r: nr, c: nc });
                    } else {
                        if (enemyMap[target]) m.push({ r: nr, c: nc });
                        break;
                    }
                    nr += dr; nc += dc;
                }
            }
        }

        if (p === 'R' || p === 'r' || p === 'Q' || p === 'q') {
            for (var i = 0; i < four; i++) {
                var dr = R_DR[i], dc = R_DC[i];
                var nr = r + dr, nc = c + dc;
                while (nr >= zero && nr < eight && nc >= zero && nc < eight) {
                    var target = b[nr][nc];
                    if (target === '') {
                        m.push({ r: nr, c: nc });
                    } else {
                        if (enemyMap[target]) m.push({ r: nr, c: nc });
                        break;
                    }
                    nr += dr; nc += dc;
                }
            }
        }

        if (p === 'K' || p === 'k') {
            for (var i = 0; i < eight; i++) {
                var nr = r + K_DR[i], nc = c + K_DC[i];
                if (nr >= zero && nr < eight && nc >= zero && nc < eight) {
                    var target = b[nr][nc];
                    if (target === '' || enemyMap[target]) m.push({ r: nr, c: nc });
                }
            }
            if (!checkCastlingSafe && !inSim) {
                var expectedRow = isW ? seven : zero;
                var enemyCl = isW ? 'B' : 'W';
                if (r === expectedRow && c === four && !hasMoved[cl + '_K'] && !isSquareAttacked(r, c, enemyCl, b)) {
                    var rookChar = isW ? 'R' : 'r';
                    if (!hasMoved[cl + '_R8'] && b[r][five] === '' && b[r][six] === '' && b[r][seven] === rookChar) {
                        if (!isSquareAttacked(r, five, enemyCl, b) && !isSquareAttacked(r, six, enemyCl, b)) {
                            m.push({ r: r, c: six, isCastle: true });
                        }
                    }
                    if (!hasMoved[cl + '_R1'] && b[r][one] === '' && b[r][two] === '' && b[r][three] === '' && b[r][zero] === rookChar) {
                        if (!isSquareAttacked(r, two, enemyCl, b) && !isSquareAttacked(r, three, enemyCl, b)) {
                            m.push({ r: r, c: two, isCastle: true });
                        }
                    }
                }
            }
        }
        return m;
    }

    function getLegal(r, c, b, inSim, kPos) {
        var origPiece = b[r][c];
        var cl = isWhiteMap[origPiece] ? 'W' : 'B';
        var isKing = (origPiece === 'K' || origPiece === 'k');
        var pseudo = getPseudo(r, c, b, false, inSim);
        var legal = [];

        for (var i = 0; i < pseudo.length; i++) {
            var m = pseudo[i];
            var captured = b[m.r][m.c];
            var epCaptured = '';

            if (m.isENPassant) {
                epCaptured = b[r][m.c];
                b[r][m.c] = '';
            }
            b[m.r][m.c] = origPiece;
            b[r][c] = '';

            var activeKPos = isKing ? { r: m.r, c: m.c } : kPos;
            if (!check(cl, b, activeKPos)) legal.push(m);

            b[r][c] = origPiece;
            b[m.r][m.c] = captured;
            if (m.isENPassant) b[r][m.c] = epCaptured;
        }
        return legal;
    }
    function draw() {
        var t = document.getElementById('tbl');
        if (!t) return;
        t.innerHTML = '';
        for (var r = 0; r < 8; r++) {
            var tr = document.createElement('tr');
            for (var c = 0; c < 8; c++) {
                var td = document.createElement('td');
                td.style.width = '45px'; td.style.height = '45px'; td.style.textAlign = 'center'; td.style.fontSize = '30px'; td.style.cursor = 'pointer';
                td.style.fontFamily = 'sans-serif';
                td.style.position = 'relative';
                td.style.backgroundColor = (r + c) % 2 === 0 ? '#f0d9b5' : '#b58863';

                if (bd[r][c]) {
                    td.innerText = syms[bd[r][c]];
                    if (isWhiteMap[bd[r][c]]) {
                        td.style.color = '#ffffff';
                        td.style.textShadow = '1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 0 #000, 1px 0 0 #000, 0 -1px 0 #000, -1px 0 0 #000';
                    } else {
                        td.style.color = '#151515';
                        td.style.textShadow = 'none';
                    }
                }

                if (sel && sel.r === r && sel.c === c) td.style.backgroundColor = '#7fffd4';

                for (var i = 0; i < moves.length; i++) {
                    if (moves[i].r === r && moves[i].c === c) {
                        var dot = document.createElement('div');
                        dot.style.position = 'absolute';
                        dot.style.top = '50%';
                        dot.style.left = '50%';
                        dot.style.transform = 'translate(-50%, -50%)';
                        dot.style.borderRadius = '50%';
                        dot.style.backgroundColor = 'rgba(0, 0, 0, 0.15)';

                        if (bd[r][c]) {
                            dot.style.width = '38px';
                            dot.style.height = '38px';
                            dot.style.border = '4px solid rgba(0, 0, 0, 0.15)';
                            dot.style.backgroundColor = 'transparent';
                        } else {
                            dot.style.width = '12px';
                            dot.style.height = '12px';
                        }
                        td.appendChild(dot);
                    }
                }

                (function(row, col) { td.onclick = function() { clickSq(row, col); }; })(r, c);
                tr.appendChild(td);
            }
            t.appendChild(tr);
        }
    }

    function clickSq(r, c) {
        var playerColor = document.getElementById('pColor').value;
        if (turn !== playerColor) return;

        var p = bd[r][c], isW = p && getColor(p) === playerColor;
        if (sel === null) {
            if (isW) { sel = { r: r, c: c }; moves = getLegal(r, c, bd, false, null); draw(); }
        } else {
            var m = moves.find(function(x) { return x.r === r && x.c === c; });
            if (m) {
                document.getElementById('pColor').disabled = true;
                document.getElementById('diff').disabled = true;

                if (m.isENPassant) bd[sel.r][c] = '';
                bd[r][c] = bd[sel.r][sel.c];
                bd[sel.r][sel.c] = '';

                var zero = 0, two = 2, three = 3, five = 5, six = 6, seven = 7;
                if ((bd[r][c] === 'P' && r === zero) || (bd[r][c] === 'p' && r === seven)) {
                    window.pendingPromo = { row: r, col: c, color: playerColor };
                    document.getElementById('promoModal').style.display = 'flex';
                    sel = null; moves = []; draw();
                    return;
                }

                if ((bd[r][c] === 'K' || bd[r][c] === 'k') && Math.abs(c - sel.c) === two) {
                    if (c === six) {
                        bd[r].splice(five, 1, bd[r][seven]);
                        bd[r].splice(seven, 1, '');
                    }
                    if (c === two) {
                        bd[r].splice(three, 1, bd[r][zero]);
                        bd[r].splice(zero, 1, '');
                    }
                }

                if (bd[r][c] === 'K') hasMoved['W_K'] = true;
                if (bd[r][c] === 'R' && sel.r === seven && sel.c === zero) hasMoved['W_R1'] = true;
                if (bd[r][c] === 'R' && sel.r === seven && sel.c === seven) hasMoved['W_R8'] = true;
                if (bd[r][c] === 'k') hasMoved['B_K'] = true;
                if (bd[r][c] === 'r' && sel.r === zero && sel.c === zero) hasMoved['B_R1'] = true;
                if (bd[r][c] === 'r' && sel.r === zero && sel.c === seven) hasMoved['B_R8'] = true;

                epSquare = m.isDouble ? { r: (sel.r + r) / two, c: c } : null;

                saveState();
                sel = null; moves = [];

                var nextTurn = playerColor === 'W' ? 'B' : 'W';
                if (endState(nextTurn)) return;
                turn = nextTurn;

                document.getElementById('msg').innerText = "Bot thinking...";
                draw();
                setTimeout(bot, 40);
            } else {
                sel = isW ? { r: r, c: c } : null;
                moves = sel ? getLegal(r, c, bd, false, null) : [];
                draw();
            }
        }
    }
    function bot() {
        var diffSetting = document.getElementById('diff').value;
        var maxDepth = diffSetting === "1600" ? 5 : (diffSetting === "1200" ? 3 : 2);
        var maxQDepth = diffSetting === "1600" ? 4 : (diffSetting === "1200" ? 3 : 2);
        var timeLimitMs = diffSetting === "1600" ? 450 : (diffSetting === "1200" ? 200 : 80);
        var startTime = Date.now();
        var timeUp = false;

        var botColor = document.getElementById('pColor').value === 'W' ? 'B' : 'W';
        var zero = 0, one = 1, two = 2, three = 3, four = 4, five = 5, six = 6, seven = 7, eight = 8;

        var pFlat = "0000000055500555000000000000000000000000000000005550055500000000".split("").map(Number);
        var nFlat = JSON.parse("[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,5,5,0,-20,-40,-30,5,15,20,20,15,5,-30,-30,0,20,30,30,20,0,-30,-30,5,20,30,30,20,5,-30,-30,0,15,20,20,15,0,-30,-40,-20,0,0,0,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50]");
        var cFlat = JSON.parse("[-3,-2,-2,-2,-2,-2,-2,-3,-2,0,0,0,0,0,0,-2,-2,0,2,4,4,2,0,-2,-2,0,4,8,8,4,0,-2,-2,0,4,8,8,4,0,-2,-2,0,2,4,4,2,0,-2,-2,0,0,0,0,0,0,-2,-3,-2,-2,-2,-2,-2,-2,-3]");

        var simBoard = JSON.parse(JSON.stringify(bd));
        var wKing = { r: seven, c: four }, bKing = { r: zero, c: four };
        for (var r = 0; r < eight; r++) {
            for (var c = 0; c < eight; c++) {
                if (simBoard[r][c] === 'K') { wKing.r = r; wKing.c = c; }
                else if (simBoard[r][c] === 'k') { bKing.r = r; bKing.c = c; }
            }
        }

        function evalBoard(b) {
            var score = 0;
            var wBishops = 0, bBishops = 0;
            var wQueens = 0, bQueens = 0;
            var wMaterial = 0, bMaterial = 0;
            var wKingR = seven, wKingC = four, bKingR = zero, bKingC = four;

            for (var r = 0; r < eight; r++) {
                var row = b[r];
                var r8 = r * eight;
                for (var c = 0; c < eight; c++) {
                    var p = row[c];
                    if (p === '') continue;
                    var idx = r8 + c;
                    var val = vals[p];

                    if (p === 'p') {
                        bMaterial += 100;
                        var pBonus = (c === three || c === four) && r === one ? -20 : pFlat[idx];
                        val += pBonus + cFlat[idx] * three + (r - one) * seven;
                        if (r > zero && ((c > zero && b[r - one][c - one] === 'p') || (c < seven && b[r - one][c + one] === 'p'))) val += 10;
                    } else if (p === 'P') {
                        wMaterial += 100;
                        var pBonus = (c === three || c === four) && r === six ? -20 : pFlat[idx];
                        val += pBonus + cFlat[idx] * three + (six - r) * seven;
                        if (r < seven && ((c > zero && b[r + one][c - one] === 'P') || (c < seven && b[r + one][c + one] === 'P'))) val += 10;
                    } else if (p === 'n') {
                        bMaterial += 300;
                        val += nFlat[idx] + cFlat[idx] * six;
                        if (r === zero) val -= 10;
                    } else if (p === 'N') {
                        wMaterial += 300;
                        val += nFlat[idx] + cFlat[idx] * six;
                        if (r === seven) val -= 10;
                    } else if (p === 'b') {
                        bMaterial += 310;
                        bBishops++;
                        val += cFlat[idx] * 9;
                        if (r === zero) val -= 10;
                    } else if (p === 'B') {
                        wMaterial += 310;
                        wBishops++;
                        val += cFlat[idx] * 9;
                        if (r === seven) val -= 10;
                    } else if (p === 'r') {
                        bMaterial += 500;
                        if (r === six) val += 25;
                    } else if (p === 'R') {
                        wMaterial += 500;
                        if (r === one) val += 25;
                    } else if (p === 'q') {
                        bMaterial += 900;
                        bQueens++;
                        if (r !== zero && r < three) val -= 35;
                    } else if (p === 'Q') {
                        wMaterial += 900;
                        wQueens++;
                        if (r !== seven && r > four) val -= 35;
                    } else if (p === 'k') {
                        bKingR = r; bKingC = c;
                    } else if (p === 'K') {
                        wKingR = r; wKingC = c;
                    }

                    if (isBlackMap[p]) score += val;
                    else score -= val;
                }
            }

            if (bBishops >= two) score += 35;
            if (wBishops >= two) score -= 35;

            var isEndgame = (wQueens === zero && bQueens === zero) || (wMaterial <= 1300 && bMaterial <= 1300);
            if (isEndgame) {
                score += cFlat[bKingR * eight + bKingC] * 10;
                score -= cFlat[wKingR * eight + wKingC] * 10;

                var matDiff = bMaterial - wMaterial;
                var kingDist = Math.abs(bKingR - wKingR) + Math.abs(bKingC - wKingC);
                if (matDiff >= 300) {
                    var wEdgeDist = Math.abs(wKingR - 3.5) + Math.abs(wKingC - 3.5);
                    score += Math.round(wEdgeDist * 14) + (14 - kingDist) * six;
                } else if (matDiff <= -300) {
                    var bEdgeDist = Math.abs(bKingR - 3.5) + Math.abs(bKingC - 3.5);
                    score -= Math.round(bEdgeDist * 14) + (14 - kingDist) * six;
                }
            } else {
                if (bKingR === zero && (bKingC === six || bKingC === two || bKingC === one || bKingC === seven)) score += 50;
                else if (bKingR === zero && bKingC === four) score += 10;
                else score -= 40;

                if (wKingR === seven && (wKingC === six || wKingC === two || wKingC === one || wKingC === seven)) score -= 50;
                else if (wKingR === seven && wKingC === four) score -= 10;
                else score += 40;
            }

            return score;
        }

        function getFastMoves(cl, b, inSim, capturesOnly) {
            var list = [];
            var colorMap = cl === 'W' ? isWhiteMap : isBlackMap;
            for (var r = 0; r < eight; r++) {
                var row = b[r];
                for (var c = 0; c < eight; c++) {
                    var piece = row[c];
                    if (piece !== '' && colorMap[piece]) {
                        var pseudo = getPseudo(r, c, b, true, inSim);
                        for (var i = 0; i < pseudo.length; i++) {
                            var to = pseudo[i];
                            var target = b[to.r][to.c];
                            if (capturesOnly && target === '' && !to.isENPassant) continue;
                            var mvvScore = target !== '' ? (vals[target] * 10 - vals[piece]) : 0;
                            list.push({ fr: r, fc: c, to: to, order: mvvScore });
                        }
                    }
                }
            }
            return list.sort(function(a, b) { return b.order - a.order; });
        }

        function makeSimMove(b, m) {
            var fr = m.fr, fc = m.fc, tr = m.to.r, tc = m.to.c;
            var origPiece = b[fr][fc];
            var captured = b[tr][tc];
            var epCaptured = '';

            var placedPiece = origPiece;
            if (tr === seven && origPiece === 'p') placedPiece = 'q';
            else if (tr === zero && origPiece === 'P') placedPiece = 'Q';

            b[tr][tc] = placedPiece;
            b[fr][fc] = '';

            if (origPiece === 'K') { wKing.r = tr; wKing.c = tc; }
            else if (origPiece === 'k') { bKing.r = tr; bKing.c = tc; }

            if (m.to.isENPassant) {
                epCaptured = b[fr][tc];
                b[fr][tc] = '';
            }
            if (m.to.isCastle) {
                if (tc === six) {
                    b[tr].splice(five, 1, b[tr][seven]);
                    b[tr].splice(seven, 1, '');
                } else if (tc === two) {
                    b[tr].splice(three, 1, b[tr][zero]);
                    b[tr].splice(zero, 1, '');
                }
            }
            return { origPiece: origPiece, captured: captured, epCaptured: epCaptured };
        }

        function unmakeSimMove(b, m, u) {
            var fr = m.fr, fc = m.fc, tr = m.to.r, tc = m.to.c;
            var origPiece = u.origPiece;
            b[fr][fc] = origPiece;
            b[tr][tc] = u.captured;

            if (origPiece === 'K') { wKing.r = fr; wKing.c = fc; }
            else if (origPiece === 'k') { bKing.r = fr; bKing.c = fc; }

            if (m.to.isENPassant) b[fr][tc] = u.epCaptured;
            if (m.to.isCastle) {
                if (tc === six) {
                    b[tr].splice(seven, 1, b[tr][five]);
                    b[tr].splice(five, 1, '');
                } else if (tc === two) {
                    b[tr].splice(zero, 1, b[tr][three]);
                    b[tr].splice(three, 1, '');
                }
            }
        }

        var nodes = 0;
        function quiesce(b, alpha, beta, isMax, qDepth) {
            if ((++nodes & 63) === 0 && Date.now() - startTime > timeLimitMs) {
                timeUp = true;
                return 0;
            }
            var standPat = evalBoard(b);
            if (qDepth === 0) return standPat;

            if (isMax) {
                if (standPat >= beta) return beta;
                if (standPat + 950 < alpha) return alpha;
                if (standPat > alpha) alpha = standPat;
            } else {
                if (standPat <= alpha) return alpha;
                if (standPat - 950 > beta) return beta;
                if (standPat < beta) beta = standPat;
            }

var activeColor = isMax ? 'B' : 'W';
var enemyColor = isMax ? 'W' : 'B';
var myKing = isMax ? bKing : wKing;
var capMoves = getFastMoves(activeColor, b, true, true);
for (var i = 0; i < capMoves.length; i++) {
var m = capMoves[i];
var uData = makeSimMove(b, m);
if (isSquareAttacked(myKing.r, myKing.c, enemyColor, b)) {
unmakeSimMove(b, m, uData);
continue;
}
var score = quiesce(b, alpha, beta, !isMax, qDepth - 1);
unmakeSimMove(b, m, uData);
if (timeUp) return 0;
if (isMax) {
if (score >= beta) return beta;
if (score > alpha) alpha = score;
} else {
if (score <= alpha) return alpha;
if (score < beta) beta = score;
}
}
return isMax ? alpha : beta;
}
function minimax(b, depth, alpha, beta, isMax) {
if ((++nodes & 63) === 0 && Date.now() - startTime > timeLimitMs) {
timeUp = true;
return 0;
}
if (depth === 0) return quiesce(b, alpha, beta, isMax, maxQDepth);
var activeColor = isMax ? 'B' : 'W';
var enemyColor = isMax ? 'W' : 'B';
var myKing = isMax ? bKing : wKing;
var movesList = getFastMoves(activeColor, b, true, false);
var legalCount = 0;
if (isMax) {
var maxVal = -Infinity;
for (var i = 0; i < movesList.length; i++) {
var uData = makeSimMove(b, movesList[i]);
if (isSquareAttacked(myKing.r, myKing.c, enemyColor, b)) {
unmakeSimMove(b, movesList[i], uData);
continue;
}
legalCount++;
var score = minimax(b, depth - 1, alpha, beta, false);
unmakeSimMove(b, movesList[i], uData);
if (timeUp) return 0;
if (score > maxVal) maxVal = score;
if (score > alpha) alpha = score;
if (beta <= alpha) break;
}
if (legalCount === 0) {
return isSquareAttacked(myKing.r, myKing.c, enemyColor, b) ? -999999 - depth : 0;
}
return maxVal;
} else {
var minVal = Infinity;
for (var i = 0; i < movesList.length; i++) {
var uData = makeSimMove(b, movesList[i]);
if (isSquareAttacked(myKing.r, myKing.c, enemyColor, b)) {
unmakeSimMove(b, movesList[i], uData);
continue;
}
legalCount++;
var score = minimax(b, depth - 1, alpha, beta, true);
unmakeSimMove(b, movesList[i], uData);
if (timeUp) return 0;
if (score < minVal) minVal = score;
if (score < beta) beta = score;
if (beta <= alpha) break;
}
if (legalCount === 0) {
return isSquareAttacked(myKing.r, myKing.c, enemyColor, b) ? 999999 + depth : 0;
}
return minVal;
}
}
var topMoves = [];
var rootColorMap = botColor === 'W' ? isWhiteMap : isBlackMap;
var rootKing = botColor === 'W' ? wKing : bKing;
for (var r = 0; r < eight; r++) {
for (var c = 0; c < eight; c++) {
var piece = simBoard[r][c];
if (piece !== '' && rootColorMap[piece]) {
var leg = getLegal(r, c, simBoard, false, rootKing);
for (var i = 0; i < leg.length; i++) {
var to = leg[i];
var target = simBoard[to.r][to.c];
var mvvScore = target !== '' ? (vals[target] * 10 - vals[piece]) : 0;
topMoves.push({ fr: r, fc: c, to: to, order: mvvScore });
}
}
}
}
topMoves.sort(function(a, b) { return b.order - a.order; });
if (topMoves.length === 0) return;
var bm = null;
var botPiecesMoved = 0;
if (botColor === 'W') {
for (var c = 0; c < eight; c++) {
if (simBoard[six][c] !== 'P') botPiecesMoved++;
if (simBoard[seven][c] === '') botPiecesMoved++;
}
} else {
for (var c = 0; c < eight; c++) {
if (simBoard[one][c] !== 'p') botPiecesMoved++;
if (simBoard[zero][c] === '') botPiecesMoved++;
}
}
if (botPiecesMoved <= two) {
var candidateMoves = [];
if (botColor === 'W') {
if (botPiecesMoved === zero) {
candidateMoves = [{ fr: six, fc: four, tr: four, tc: four }, { fr: six, fc: three, tr: four, tc: three }];
} else {
candidateMoves = [{ fr: seven, fc: six, tr: five, tc: five }, { fr: seven, fc: one, tr: five, tc: two }];
}
} else {
if (botPiecesMoved === zero) {
if (simBoard[four][four] === 'P') {
candidateMoves = [{ fr: one, fc: four, tr: three, tc: four }, { fr: one, fc: two, tr: three, tc: two }];
} else {
candidateMoves = [{ fr: one, fc: three, tr: three, tc: three }, { fr: zero, fc: six, tr: two, tc: five }];
}
} else {
candidateMoves = [{ fr: zero, fc: one, tr: two, tc: two }, { fr: zero, fc: six, tr: two, tc: five }];
}
}
var validBook = topMoves.filter(function(m) {
return candidateMoves.some(function(cm) {
return cm.fr === m.fr && cm.fc === m.fc && cm.tr === m.to.r && cm.tc === m.to.c;
});
});
if (validBook.length > zero) {
bm = validBook[Math.floor(Math.random() * validBook.length)];
}
}
if (!bm) {
var bestEvaluatedMoves = [];
for (var d = 1; d <= maxDepth; d++) {
var currentDepthMoves = [];
for (var i = 0; i < topMoves.length; i++) {
var m = topMoves[i];
var uData = makeSimMove(simBoard, m);
var baseValue = minimax(simBoard, d - 1, -Infinity, Infinity, botColor === 'W');
unmakeSimMove(simBoard, m, uData);
if (timeUp) break;
currentDepthMoves.push({ move: m, score: baseValue });
}
if (timeUp) break;
currentDepthMoves.sort(function(a, b) {
return botColor === 'B' ? b.score - a.score : a.score - b.score;
});
bestEvaluatedMoves = currentDepthMoves;
topMoves = bestEvaluatedMoves.map(function(item) { return item.move; });
}
if (bestEvaluatedMoves.length === 0) {
bestEvaluatedMoves = [{ move: topMoves[zero], score: 0 }];
}
var roll = Math.random() * 100;
var targetIndex = 0;
if (diffSetting === "1600") {
targetIndex = 0;
} else if (diffSetting === "1200") {
if (roll > 92 && bestEvaluatedMoves.length > 1) targetIndex = 1;
} else if (diffSetting === "800") {
if (roll > 82 && bestEvaluatedMoves.length > 1) {
targetIndex = Math.min(Math.floor(Math.random() * two) + 1, bestEvaluatedMoves.length - 1);
}
}
bm = bestEvaluatedMoves[targetIndex].move;
}
if (bd[bm.fr][bm.fc] === 'K') hasMoved['W_K'] = true;
if (bd[bm.fr][bm.fc] === 'R' && bm.fr === seven && bm.fc === zero) hasMoved['W_R1'] = true;
if (bd[bm.fr][bm.fc] === 'R' && bm.fr === seven && bm.fc === seven) hasMoved['W_R8'] = true;
if (bd[bm.fr][bm.fc] === 'k') hasMoved['B_K'] = true;
if (bd[bm.fr][bm.fc] === 'r' && bm.fr === zero && bm.fc === zero) hasMoved['B_R1'] = true;
if (bd[bm.fr][bm.fc] === 'r' && bm.fr === zero && bm.fc === seven) hasMoved['B_R8'] = true;
if (bm.to.isENPassant) bd[bm.fr][bm.to.c] = '';
var botFromCol = bm.fc;
var botFromRow = bm.fr;
bd[bm.to.r][bm.to.c] = bd[bm.fr][bm.fc];
bd[bm.fr][bm.fc] = '';
if (bd[bm.to.r][bm.to.c] === 'p' && bm.to.r === seven) bd[bm.to.r][bm.to.c] = 'q';
if (bd[bm.to.r][bm.to.c] === 'P' && bm.to.r === zero) bd[bm.to.r][bm.to.c] = 'Q';
if ((bd[bm.to.r][bm.to.c] === 'K' || bd[bm.to.r][bm.to.c] === 'k') && Math.abs(bm.to.c - botFromCol) === two) {
if (bm.to.c === six) {
bd[bm.to.r].splice(five, 1, bd[bm.to.r][seven]);
bd[bm.to.r].splice(seven, 1, '');
}
if (bm.to.c === two) {
bd[bm.to.r].splice(three, 1, bd[bm.to.r][zero]);
bd[bm.to.r].splice(zero, 1, '');
}
}
epSquare = ((bd[bm.to.r][bm.to.c] === 'p' || bd[bm.to.r][bm.to.c] === 'P') && Math.abs(bm.to.r - botFromRow) === two) ? { r: (botFromRow + bm.to.r) / two, c: bm.to.c } : null;
saveState();
var playerColor = document.getElementById('pColor').value;
turn = playerColor;
endState(playerColor);
draw();
}
function handlePromoSelection(pieceType) {
if (!window.pendingPromo) return;
var r = window.pendingPromo.row;
var c = window.pendingPromo.col;
var cl = window.pendingPromo.color;
bd[r][c] = cl === 'W' ? pieceType.toUpperCase() : pieceType.toLowerCase();
document.getElementById('promoModal').style.display = 'none';
window.pendingPromo = null;
if (endState(cl === 'W' ? 'B' : 'W')) return;
turn = cl === 'W' ? 'B' : 'W';
document.getElementById('msg').innerText = "Bot thinking...";
draw();
setTimeout(bot, 40);
}
function changeColor() {
var choice = document.getElementById('pColor').value;
if (choice === 'B') {
turn = 'W';
document.getElementById('pColor').disabled = true;
document.getElementById('diff').disabled = true;
document.getElementById('msg').innerText = "Bot thinking...";
setTimeout(bot, 150);
} else {
turn = 'W';
document.getElementById('msg').innerText = "Your Turn (White)";
}
}
function endState(cl) {
var currentStr = JSON.stringify(bd);
var repeatCount = 0;
for (var i = 0; i < boardHistory.length; i++) {
var entry = JSON.parse(boardHistory[i]);
var hBoard = Array.isArray(entry) ? entry : entry.bd;
if (JSON.stringify(hBoard) === currentStr) repeatCount++;
}
if (repeatCount >= 3) {
document.getElementById('msg').innerText = "Draw by Threefold Repetition!";
turn = 'E';
return true;
}
var any = false;
for (var r = 0; r < 8; r++) {
for (var c = 0; c < 8; c++) {
if (bd[r][c] && getColor(bd[r][c]) === cl && getLegal(r, c, bd, false, null).length > 0) {
any = true; break;
}
}
if (any) break;
}
var box = document.getElementById('msg');
var playerColor = document.getElementById('pColor').value;
var colorLabel = playerColor === 'W' ? 'White' : 'Black';
if (!any) {
box.innerText = check(cl, bd, null) ? (cl === playerColor ? "Checkmate! Bot wins." : "Checkmate! You win!") : "Draw / Stalemate!";
turn = 'E';
return true;
}
box.innerText = check(cl, bd, null) ? "Your Turn - CHECK!" : (cl === playerColor ? "Your Turn (" + colorLabel + ")" : "Bot calculating...");
return false;
}
function undo() {
var playerColor = document.getElementById('pColor').value;
var minHistory = playerColor === 'W' ? 3 : 4;
var zero = 0, one = 1, four = 4, seven = 7;
if (window.pendingPromo) {
window.pendingPromo = null;
document.getElementById('promoModal').style.display = 'none';
var curSnap = JSON.parse(boardHistory[boardHistory.length - one]);
bd = Array.isArray(curSnap) ? curSnap : curSnap.bd;
epSquare = curSnap.epSquare || null;
sel = null; moves = []; turn = playerColor;
endState(playerColor); draw();
return;
}
if (boardHistory.length < minHistory) return;
if (turn !== playerColor && turn !== 'E') return;
boardHistory.pop();
boardHistory.pop();
var prev = JSON.parse(boardHistory[boardHistory.length - one]);
bd = Array.isArray(prev) ? prev : prev.bd;
epSquare = prev.epSquare || null;
hasMoved = {
'W_K': false, 'W_R1': false, 'W_R8': false,
'B_K': false, 'B_R1': false, 'B_R8': false
};
for (var i = 0; i < boardHistory.length; i++) {
var entry = JSON.parse(boardHistory[i]);
var hBoard = Array.isArray(entry) ? entry : entry.bd;
if (hBoard[seven][four] !== 'K') hasMoved['W_K'] = true;
if (hBoard[seven][zero] !== 'R') hasMoved['W_R1'] = true;
if (hBoard[seven][seven] !== 'R') hasMoved['W_R8'] = true;
if (hBoard[zero][four] !== 'k') hasMoved['B_K'] = true;
if (hBoard[zero][zero] !== 'r') hasMoved['B_R1'] = true;
if (hBoard[zero][seven] !== 'r') hasMoved['B_R8'] = true;
}
sel = null; moves = []; turn = playerColor;
endState(playerColor); draw();
}
function rst() {
bd = JSON.parse(JSON.stringify(start));
sel = null; moves = []; turn = 'W';
boardHistory = [];
saveState();
epSquare = null;
hasMoved = { 'W_K': false, 'W_R1': false, 'W_R8': false, 'B_K': false, 'B_R1': false, 'B_R8': false };
document.getElementById('pColor').disabled = false;
document.getElementById('diff').disabled = false;
document.getElementById('pColor').value = 'W';
document.getElementById('msg').innerText = "Your Turn (White)";
draw();
}
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', draw);
} else {
draw();
}
